name: a

services:
  app:
    build: .
    ports:
      - "8080:80"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.0
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  model-loader:
    image: ollama/ollama:0.12.0
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull gemma3:4b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama-data:
